[tool.poetry]
name = "SPINO"
version = "0.1.0"
description = "SPIce Neural Operator development"
authors = ["Austin Rhodes <a18rhodes@gmail.com>"]
readme = "README.md"
packages = [{ include = "spino" }]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = "~3.11"
torch = "^2.9.1"
neuraloperator = "^2.0.0"
scipy = "^1.17.0"
matplotlib = "^3.10.8"
numpy = "^2.4.1"
jupyter = "^1.1.1 "
ipykernel = "^7.1.0"
tensorboard = "^2.20.0"
pyspice = "^1.5"
volare = "^0.20.6"
click = "^8.3.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=7,<10"
pytest-cov = "^4.0"
ruff = "^0.16.8"
mypy = "^1.19.1"
jupyterlab = "^4.5.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["sky130_volare", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "N803",   # Argument name should be lowercase — physics variable convention
    "N806",   # Variable in function should be lowercase — physics variable convention
    "N812",   # Lowercase imported as non-lowercase — torch.nn.functional as F/AF is standard
    "RUF001", # Ambiguous character in string — intentional math notation
    "RUF002", # Ambiguous character in docstring — intentional math notation
    "B905",   # zip() without explicit strict= — not enforced project-wide
    "E741",   # Ambiguous variable name — single-letter physics variables (I, l) are standard
]

[tool.ruff.lint.per-file-ignores]
"spino/spice_benchmark.py" = ["F403", "F405"]
"spino/benchmarking/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["spino"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=spino --cov-report=term-missing -m 'not e2e_spice'"
markers = [
    "e2e_spice: subprocess NGSpice and/or production integration; opt-in: pytest -m e2e_spice; full suite: pytest -m 'e2e_spice or not e2e_spice'",
]
