name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}-torch-cpu

      - name: Install dependencies
        run: poetry install --with dev

      - name: Install PyTorch (CPU)
        run: poetry run pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Format check (black)
        run: poetry run black --check .

      - name: Import order check (isort)
        run: poetry run isort --check-only .

      - name: Lint (pylint)
        run: poetry run pylint spino tests --fail-under=10

      - name: Run tests
        run: poetry run pytest --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
